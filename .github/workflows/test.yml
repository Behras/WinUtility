name: PowerShell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    name: Test with ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Test selections, terminal flows, Windows adapters, repairs, and bootstrap
        shell: ${{ matrix.shell }}
        run: ./tests/Run-Tests.ps1

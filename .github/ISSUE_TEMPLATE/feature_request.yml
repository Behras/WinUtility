name: Feature request
description: Suggest a change to laptop setup or repair.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the task or problem on your laptops.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Explain where it belongs and how you would use it.
    validations:
      required: true
